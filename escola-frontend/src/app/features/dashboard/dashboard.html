<div class="min-h-screen bg-slate-50">
  <main class="mx-auto max-w-5xl px-6 py-10">
    <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
      <div class="flex h-12 w-12 items-center justify-center rounded-full bg-emerald-100 text-emerald-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="m5 13 4 4L19 7" />
        </svg>
      </div>
      <h1 class="mt-4 text-2xl font-bold tracking-tight text-slate-900">Login realizado com sucesso</h1>
      <p class="mt-2 text-sm text-slate-500">Você está autenticado no sistema. Estas são as informações do seu token:</p>

      <dl class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div class="rounded-lg bg-slate-50 p-4">
          <dt class="text-xs font-medium uppercase tracking-wide text-slate-500">E-mail</dt>
          <dd class="mt-1 text-sm font-medium text-slate-900">{{ user()?.email ?? '—' }}</dd>
        </div>
        <div class="rounded-lg bg-slate-50 p-4">
          <dt class="text-xs font-medium uppercase tracking-wide text-slate-500">ID do usuário</dt>
          <dd class="mt-1 text-sm font-medium text-slate-900">{{ user()?.userId ?? '—' }}</dd>
        </div>
      </dl>
    </div>
  </main>
</div>
