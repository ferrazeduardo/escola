<div class="min-h-screen bg-slate-50">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
      <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-indigo-600 text-white">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3 1 9l11 6 9-4.91V17h2V9L12 3Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13.18v4.09c0 .8 2.7 2.73 7 2.73s7-1.93 7-2.73v-4.09" />
          </svg>
        </div>
        <span class="text-base font-semibold tracking-tight text-slate-900">Sistema Escolar</span>
      </div>

      <button
        type="button"
        (click)="logout()"
        class="inline-flex items-center gap-2 rounded-lg border border-slate-300 px-3.5 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M18 15l3-3m0 0-3-3m3 3H9" />
        </svg>
        Sair
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-6 py-10">
    <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
      <div class="flex h-12 w-12 items-center justify-center rounded-full bg-emerald-100 text-emerald-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="m5 13 4 4L19 7" />
        </svg>
      </div>
      <h1 class="mt-4 text-2xl font-bold tracking-tight text-slate-900">Login realizado com sucesso</h1>
      <p class="mt-2 text-sm text-slate-500">Você está autenticado no sistema. Estas são as informações do seu token:</p>

      <dl class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div class="rounded-lg bg-slate-50 p-4">
          <dt class="text-xs font-medium uppercase tracking-wide text-slate-500">E-mail</dt>
          <dd class="mt-1 text-sm font-medium text-slate-900">{{ user()?.email ?? '—' }}</dd>
        </div>
        <div class="rounded-lg bg-slate-50 p-4">
          <dt class="text-xs font-medium uppercase tracking-wide text-slate-500">ID do usuário</dt>
          <dd class="mt-1 text-sm font-medium text-slate-900">{{ user()?.userId ?? '—' }}</dd>
        </div>
      </dl>
    </div>
  </main>
</div>
