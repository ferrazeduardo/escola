version: '3.9'

services:
  kong:
    image: kong:3.9
    container_name: escola_api_gateway
    networks:
      - escola
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001" # painel admin: só acessível deste computador
    environment:
      KONG_DATABASE: "off"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_DECLARATIVE_CONFIG: "/usr/local/kong/declarative/kong.yml"
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  escola:
    external: true