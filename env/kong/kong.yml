_format_version: "3.0"
_transform: true

# Plugins globais: valem para todas as rotas.
# O cors roda antes do jwt e responde sozinho a pergunta do navegador (OPTIONS),
# que vem sem token. Os pedidos de verdade continuam passando pelo jwt de cada rota.
plugins:
  - name: cors
    config:
      origins:
        - http://localhost:4200
      methods: [GET, POST, PUT, DELETE, OPTIONS]
      headers: [Authorization, Content-Type]
      max_age: 3600

services:
  - name: api_usuario_service
    host: usuarioapi
    port: 8080
    protocol: http
    routes:
      - name: usuario_routes
        paths:
          - /auth
        strip_path: true
        plugins:
          - name: jwt

      - name: login
        paths:
          - /login
        strip_path: false
        # sem JWT aqui — rota pública

  - name: api_rede_service
    host: redeapi
    port: 8080
    protocol: http
    routes:
      - name: rede_routes
        paths:
          - /redes
        strip_path: true
        plugins:
          - name: jwt
    
  - name: api_academico_service
    host: academicoapi
    port: 8080
    protocol: http
    routes:
      - name: academico_routes
        paths:
          - /academico
        strip_path: true
        plugins:
          - name: jwt

      # - name: api_academico_service
